#################################
# ---- SECRETS ----
# S3_ACCESS_KEY_ID
# S3_SECRET_ACCESS_KEY
# -----------------
# ---- VARS ----
# SERVICE_NAME
# S3_FOLDER [services/tools]
#################################
name: Build Docker on Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build Docker image and export to tar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{vars.SERVICE_NAME}}:${{ steps.tag.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.tag }}
          outputs: type=docker,dest=/tmp/${{vars.SERVICE_NAME}}-${{ steps.tag.outputs.tag }}.tar

      - name: Create GitHub Release with image
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/${{vars.SERVICE_NAME}}-${{ steps.tag.outputs.tag }}.tar
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false

      - name: Upload Docker image to S3
        env:
            S3_FOLDER: ${{ vars.S3_FOLDER }}
            SERVICE_NAME: ${{ vars.SERVICE_NAME }}
            AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: us-east-1
            AWS_EC2_METADATA_DISABLED: true
            TAG: ${{ steps.tag.outputs.tag }}
        run: |
          FILE="/tmp/${SERVICE_NAME}-${TAG}.tar"
          test -f "$FILE" || { echo "::error::missing $FILE"; ls -lah /tmp; exit 1; }

          # Stage everything into one folder
          PKG_DIR="/tmp/${SERVICE_NAME}-${TAG}-pkg"
          mkdir -p "${PKG_DIR}/docs"

          cp "$FILE" "${PKG_DIR}/${SERVICE_NAME}.${TAG}.DOCKER_IMAGE.tar"

          if [ -f .env.example ]; then
            cp .env.example "${PKG_DIR}/${SERVICE_NAME}.${TAG}.ENV.example"
          else
            echo "skip .env.example (not found)"
          fi

          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md "${PKG_DIR}/docs/${SERVICE_NAME}.${TAG}.CHANGELOG.md"
          else
            echo "skip CHANGELOG.md (not found)"
          fi

          if [ -f README.md ]; then
            cp README.md "${PKG_DIR}/docs/${SERVICE_NAME}.${TAG}.README.md"
          else
            echo "skip README.md (not found)"
          fi

          # Zip it (contents at zip root, docs/ preserved inside)
          ZIP="/tmp/${SERVICE_NAME}-${TAG}.zip"
          (cd "${PKG_DIR}" && zip -r -9 "$ZIP" .)

          # Clean old artifacts for this service
          aws s3 rm "s3://y.packages/${S3_FOLDER}/" --recursive \
            --exclude "*" \
            --include "${SERVICE_NAME}/*" \
            --include "${SERVICE_NAME}-*"

          # Upload single zip
          aws s3 cp "$ZIP" \
            "s3://y.packages/${S3_FOLDER}/${SERVICE_NAME}-${TAG}.zip" \
            --metadata "tag=${TAG},commit=${GITHUB_SHA}" \
            --checksum-algorithm CRC32 \
            --no-progress
